{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Sign in" %}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>{% translate "Sign in" %}</h1>
  <form method="post" class="stacked" novalidate>
    {% csrf_token %}
    {% include "core/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-block">{% translate "Sign in" %}</button>
  </form>
  <p class="muted small">{% translate "Forgot your password? Ask your manager for a new password link." %}</p>
</div>
{% endblock %}
